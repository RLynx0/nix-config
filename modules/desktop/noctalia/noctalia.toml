[nightlight]
enabled = false

[notification]
enable_daemon = true

[shell]
avatar_path = "/home/lynx/Personal/Pictures/renders/LynxLogo.png"
clipboard_auto_paste = "auto"
clipboard_enabled = true
clipboard_history_max_entries = 100
clipboard_keep_from_closed_apps = true
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    auto_paste = "auto"

    [shell.screenshot]
    copy_to_clipboard = true
    directory = "/home/lynx/Personal/Pictures/screenshots"
    freeze_screen = true
    save_to_file = true

    [[shell.session.actions]]
    action = "lock"

    [[shell.session.actions]]
    action = "hibernate"
    command = "systemctl hibernate"
    label = "Hibernate"

    [[shell.session.actions]]
    action = "logout"

    [[shell.session.actions]]
    action = "shutdown"

    [[shell.session.actions]]
    action = "suspend"

    [[shell.session.actions]]
    action = "reboot"

[storage]
key_source = "secret-service"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/lynx/Personal/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/lynx/Personal/Pictures/wallpapers/UT-Umbrella-Shortened.jpg"

    [wallpaper.last]
    path = "/home/lynx/Personal/Pictures/wallpapers/UT-Umbrella-Shortened.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/lynx/Personal/Pictures/wallpapers/UT-Umbrella-Shortened.jpg"

[widget.media]
hide_when_no_media = false
