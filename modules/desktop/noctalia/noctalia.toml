[nightlight]
enabled = false

[notification]
enable_daemon = true

[shell]
avatar_path = "/home/lynx/Personal/Pictures/renders/LynxLogo.png"
clipboard_auto_paste = "auto"
clipboard_enabled = true
clipboard_history_max_entries = 100
clipboard_keep_from_closed_apps = true
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = true
    auto_paste = "auto"

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_session = true

    [shell.screenshot]
    copy_to_clipboard = true
    directory = "/home/lynx/Personal/Pictures/screenshots"
    freeze_screen = true
    save_to_file = true

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "l"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "o"
        variant = "default"

        [[shell.session.actions]]
        action = "suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "s"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "r"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "d"
        variant = "default"

        [[shell.session.actions]]
        action = "hibernate"
        command = "systemctl hibernate"
        countdown_seconds = 0.0
        enabled = true
        label = "Hibernate"
        shortcut = "h"
        variant = "default"

[storage]
key_source = "secret-service"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/lynx/Personal/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/lynx/Personal/Pictures/wallpapers/UT-Umbrella-Shortened.jpg"

    [wallpaper.last]
    path = "/home/lynx/Personal/Pictures/wallpapers/UT-Umbrella-Shortened.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/lynx/Personal/Pictures/wallpapers/UT-Umbrella-Shortened.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/lynx/Personal/Pictures/wallpapers/UT-Umbrella-Shortened.jpg"

[widget.media]
hide_when_no_media = false
