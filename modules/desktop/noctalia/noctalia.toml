[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.75
center = [ "workspaces" ]
end = [
    "wallpaper",
    "clipboard",
    "notifications",
    "bluetooth",
    "network",
    "volume",
    "brightness",
    "battery",
    "clock",
    "session"
]
margin_ends = 6
start = [ "control-center", "launcher", "tray", "media" ]
thickness = 32
widget_spacing = 8

[dock]
smart_auto_hide = true

[hooks]
session_unlocked = [ "/home/lynx/.config/hypr/scripts/panic/lock.sh restore" ]

[idle]
behavior_order = [ "dim-locked", "screen-off-locked", "dim", "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0.0

    [idle.behavior.dim]
    action = "command"
    command = "/home/lynx/.config/hypr/scripts/idle-dim.sh dim"
    enabled = true
    resume_command = "/home/lynx/.config/hypr/scripts/idle-dim.sh restore"
    timeout = 150.0

    [idle.behavior.dim-locked]
    action = "command"
    command = "/home/lynx/.config/hypr/scripts/idle-dim.sh dim"
    enabled = true
    locked_timeout = 20.0
    resume_command = "/home/lynx/.config/hypr/scripts/idle-dim.sh restore"
    timeout = 0.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 160.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 180.0

    [idle.behavior.screen-off-locked]
    action = "screen_off"
    enabled = true
    locked_timeout = 30.0
    timeout = 0.0

[location]
address = "Siebenhaus, Austria"
latitude = 47.93095
longitude = 16.22748

[lockscreen]
allow_empty_password = false
blur_intensity = 0.29999999999999999
enabled = true
fingerprint = true
grace_period_seconds = 1
tint_color = "#000000"
tint_intensity = 0.5
transition = [ "fade" ]
transition_duration = 600.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lock-date@HDMI-A-1"]
    box_height = 45.0
    box_width = 900.0
    cx = 960.0
    cy = 100.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget."lock-date@HDMI-A-1".settings]
        background = false
        center_text = true
        color = "primary"
        font_family = "CaskaydiaCove Nerd Font Mono"
        format = "{:%A, %-d %B %Y}"
        shadow = true

